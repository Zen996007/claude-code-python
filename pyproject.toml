[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-python"
version = "0.2.0"
description = "Python rewrite scaffold inspired by Claude Code architecture"
requires-python = ">=3.11"
authors = [{ name = "WangCai Dev" }]
dependencies = [
  "typer>=0.16.0",
  "pydantic>=2.11.0",
  "rich>=14.0.0",
  "httpx>=0.28.0",
  "anyio>=4.9.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
]

[project.scripts]
claude-code-py = "claude_code_py.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
